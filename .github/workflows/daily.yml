name: Daily Strategy Run

on:
  schedule:
    - cron: "0 8 * * *"   # runs every day at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-strategy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (fresh)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Show files in workspace (debug)
        run: ls -la

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run strategy
        env:
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
        run: python real_money_generator.py

      - name: Commit state files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add open_trades.csv
          if [ -f portfolio_state.json ]; then
            git add portfolio_state.json
          fi

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "Update strategy state"
          git push origin "HEAD:${GITHUB_REF_NAME:-main}"
